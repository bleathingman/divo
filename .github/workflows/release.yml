name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: |
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Divo ${{ github.ref_name }}" \
            --notes "## Divo ${{ github.ref_name }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Build Windows (non signé)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Signature Authenticode via SignPath REST API
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $orgId  = '549bac04-15c1-411d-be59-a665db738d4f'
          $base   = "https://app.signpath.io/API/v1/$orgId"
          $bearer = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }

          # 1. ZIP les .exe à signer
          $zip = 'dist\to-sign.zip'
          Compress-Archive -Path dist\*.exe -DestinationPath $zip -Force
          Write-Host "Archive créée : $zip"

          # 2. Soumettre la demande de signature via multipart/form-data
          Add-Type -AssemblyName System.Net.Http
          $client = [System.Net.Http.HttpClient]::new()
          $client.DefaultRequestHeaders.Authorization = `
            [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:SIGNPATH_API_TOKEN)

          $form = [System.Net.Http.MultipartFormDataContent]::new()
          $form.Add([System.Net.Http.StringContent]::new('divo'), 'ProjectSlug')
          $form.Add([System.Net.Http.StringContent]::new('test-signing'), 'SigningPolicySlug')
          $form.Add([System.Net.Http.StringContent]::new('initial'), 'ArtifactConfigurationSlug')

          $bytes   = [System.IO.File]::ReadAllBytes((Resolve-Path $zip))
          $content = [System.Net.Http.ByteArrayContent]::new($bytes)
          $content.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse('application/zip')
          $form.Add($content, 'Artifact', 'artifact.zip')

          $resp = $client.PostAsync("$base/SigningRequests", $form).GetAwaiter().GetResult()
          $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json

          if (-not $resp.IsSuccessStatusCode) {
            Write-Error "Soumission SignPath échouée ($($resp.StatusCode)) : $($body | ConvertTo-Json)"
            exit 1
          }
          $id = $body.signingRequestId
          Write-Host "Demande soumise : $id"

          # 3. Attendre la fin (max 15 min)
          $deadline = (Get-Date).AddMinutes(15)
          do {
            Start-Sleep -Seconds 15
            $status = Invoke-RestMethod "$base/SigningRequests/$id" -Headers $bearer
            Write-Host "Statut : $($status.status)"
            if ((Get-Date) -gt $deadline) { Write-Error "Timeout SignPath"; exit 1 }
          } while ($status.status -in @('InProgress','WaitingForApproval','Queued'))

          if ($status.status -ne 'Completed') {
            Write-Error "Signature échouée : $($status.status)"; exit 1
          }

          # 4. Télécharger et extraire les .exe signés
          $signed = 'dist\signed.zip'
          Invoke-WebRequest $status.signedArtifactLink -Headers $bearer -OutFile $signed
          Expand-Archive $signed -DestinationPath 'dist\signed' -Force
          Copy-Item 'dist\signed\*.exe' 'dist\' -Force
          Remove-Item $zip, $signed, 'dist\signed' -Recurse -Force
          Write-Host "Signature terminée avec succès"

      - name: SHA256SUMS + upload Windows
        run: |
          $files = Get-ChildItem dist\*.exe | Select-Object -ExpandProperty FullName
          $sumsFile = "dist\SHA256SUMS-windows.txt"
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Add-Content $sumsFile
            gh release upload "${{ github.ref_name }}" $f --clobber
          }
          gh release upload "${{ github.ref_name }}" $sumsFile --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attestation de provenance SLSA (Windows)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'dist/*.exe'

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm fakeroot
      - run: npm ci
      - name: Build Linux
        run: npm run build:linux -- --publish never
      - name: SHA256SUMS + upload Linux
        run: |
          sha256sum dist/*.AppImage > dist/SHA256SUMS-linux.txt
          gh release upload "${{ github.ref_name }}" dist/*.AppImage --clobber
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS-linux.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attestation de provenance SLSA (Linux)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'dist/*.AppImage'
      - name: SBOM CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file dist/divo-sbom.json
      - name: Upload SBOM
        run: gh release upload "${{ github.ref_name }}" dist/divo-sbom.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build macOS
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: SHA256SUMS + upload macOS
        run: |
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS-macos.txt
          gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber
          gh release upload "${{ github.ref_name }}" dist/SHA256SUMS-macos.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attestation de provenance SLSA (macOS)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'dist/*.dmg'
