<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none';
             img-src https: data: blob:;
             style-src 'self' 'unsafe-inline';
             script-src 'self';
             connect-src 'none';
             frame-src 'none';
             object-src 'none';
             base-uri 'none'">
  <title>Divo — Aperçu</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%; overflow: hidden;
      background: #111113; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none; -webkit-user-select: none;
    }

    .app { display: flex; flex-direction: column; height: 100%; }

    .titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 8px 0 14px; flex-shrink: 0;
      background: #1c1c1e; border-bottom: 1px solid #252527;
    }

    .tb-favicon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; display: none; }

    .tb-title {
      flex: 1; min-width: 0; font-size: 12px; color: #aeaeb2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .tb-btn {
      -webkit-app-region: no-drag;
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 7px; border: none;
      background: transparent; color: #aeaeb2; cursor: pointer; font-size: 13px;
      transition: background .12s, color .12s; flex-shrink: 0;
    }
    .tb-btn:hover { background: #3a3a3c; color: #f5f5f7; }
    .tb-btn.promote:hover { background: rgba(10,132,255,.18); color: #0a84ff; }
    .tb-btn.close:hover { background: #ff453a; color: #fff; }

    .webview-wrap { flex: 1; position: relative; }
    webview { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <img class="tb-favicon" id="tb-favicon" alt="">
      <div class="tb-title" id="tb-title">Chargement…</div>
      <button class="tb-btn promote" id="btn-promote" title="Ouvrir dans Divo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
      <button class="tb-btn close" id="btn-close" title="Fermer">✕</button>
    </div>
    <div class="webview-wrap">
      <webview id="peek-webview" allowpopups partition="persist:divo"></webview>
    </div>
  </div>
  <script src="peek.js"></script>
</body>
</html>
