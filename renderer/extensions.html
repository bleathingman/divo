<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none';
             img-src divo: data: blob:;
             style-src 'self' 'unsafe-inline';
             script-src 'self';
             connect-src 'none';
             frame-src 'none';
             object-src 'none';
             base-uri 'none'">
  <title>Extensions — Divo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #111113; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-y: auto; }
    .page { max-width: 700px; margin: 0 auto; padding: 48px 32px; }

    h1 { font-size: 22px; font-weight: 600; color: #f5f5f7; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    h1 svg { color: #0a84ff; }
    .subtitle { font-size: 13px; color: #48484a; margin-bottom: 32px; }

    .cws-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0a84ff; color: #fff; border: none; border-radius: 10px;
      padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: filter .15s; margin-bottom: 36px;
    }
    .cws-btn:hover { filter: brightness(1.12); }

    .section-title { font-size: 11px; font-weight: 600; color: #48484a; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

    .ext-list { display: flex; flex-direction: column; gap: 2px; }

    .ext-card {
      background: #1c1c1e; border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
    }
    .ext-icon { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; flex-shrink: 0; background: #2c2c2e; }
    .ext-icon-placeholder { width: 40px; height: 40px; border-radius: 8px; background: #2c2c2e; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #636366; }
    .ext-info { flex: 1; min-width: 0; }
    .ext-name { font-size: 14px; color: #e8e8ed; font-weight: 500; }
    .ext-version { font-size: 11px; color: #48484a; margin-top: 2px; }
    .ext-desc { font-size: 12px; color: #636366; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ext-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #3a3a3c; border-radius: 26px; transition: background .2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
    .toggle input:checked + .toggle-slider { background: #34c759; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    .remove-btn { background: none; border: 1px solid #3a3a3c; border-radius: 7px; color: #636366; font-size: 12px; padding: 5px 12px; cursor: pointer; transition: all .15s; }
    .remove-btn:hover { border-color: #ff453a; color: #ff453a; }

    .empty { text-align: center; color: #3a3a3c; font-size: 14px; padding: 48px 0; }

    .installing { display: none; align-items: center; gap: 10px; color: #48484a; font-size: 13px; padding: 12px 0; }
    .installing.active { display: flex; }
    .spinner { width: 16px; height: 16px; border: 2px solid #3a3a3c; border-top-color: #0a84ff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 10px; padding: 12px 20px; font-size: 13px; color: #f5f5f7; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 99; }
    .toast.ok { border-color: #34c759; }
    .toast.err { border-color: #ff453a; }

    html[data-theme="light"], html[data-theme="light"] body { background: #f2f2f7; color: #1c1c1e; }
    html[data-theme="light"] h1 { color: #1c1c1e; }
    html[data-theme="light"] .ext-card { background: #fff; }
    html[data-theme="light"] .ext-name { color: #1c1c1e; }
    html[data-theme="light"] .ext-icon-placeholder { background: #e5e5ea; }
    html[data-theme="light"] .remove-btn { border-color: #d1d1d6; color: #8e8e93; }
    html[data-theme="light"] .toggle-slider { background: #d1d1d6; }
  </style>
</head>
<body>
  <div class="page">
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/>
      </svg>
      Extensions
    </h1>
    <p class="subtitle">Installe des extensions depuis la Chrome Web Store — elles fonctionnent directement dans Divo.</p>

    <a class="cws-btn" id="btn-cws" href="#">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Ouvrir la Chrome Web Store
    </a>

    <div class="installing" id="installing">
      <div class="spinner"></div>
      <span>Installation en cours…</span>
    </div>

    <div class="section-title">Extensions installées</div>
    <div class="ext-list" id="ext-list">
      <div class="empty">Aucune extension installée</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="extensions.js"></script>
</body>
</html>
